[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypothesaes"
version = "2.0.1"
authors = [
    {name = "Rajiv Movva", email = "rmovva@berkeley.edu"},
    {name = "Kenny Peng", email = "kennypeng@cs.cornell.edu"},
]
description = "Hypothesizing interpretable relationships in text datasets using sparse autoencoders."
readme = "README.md"
requires-python = ">=3.10,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "accelerate>=1.15.0",
    "flashinfer-jit-cache==0.6.16.post3",
    "ipykernel>=7.3.0",
    "jmespath>=1.1.0",
    "jupyter>=1.1.1",
    "litellm[proxy]>=1.108.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "openai>=3.46.0",
    "pandas>=2.3.3",
    "pytest>=9.2.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "sentence-transformers>=6.2.0",
    "statsmodels>=0.15.0",
    "tiktoken>=0.14.0",
    "torch>=2.13.0",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
    "vllm==0.28.0",
]

[project.urls]
"Homepage" = "https://github.com/rmovva/HypotheSAEs"
"Bug Tracker" = "https://github.com/rmovva/HypotheSAEs/issues"
"Changelog" = "https://github.com/rmovva/HypotheSAEs/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["hypothesaes"]
include-package-data = true

[tool.uv.sources]
flashinfer-jit-cache = { index = "flashinfer" }

[[tool.uv.index]]
name = "flashinfer"
url = "https://flashinfer.ai/whl/cu130/"
explicit = true
